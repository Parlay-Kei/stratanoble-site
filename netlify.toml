[build]
  command = "cd apps/website && rm -rf node_modules package-lock.json && npm cache clean --force && npm install --legacy-peer-deps && npm run build"
  publish = "apps/website/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20.18.0"
  NPM_VERSION = "10.8.2"
  # Ensure Netlify Next.js plugin is NOT skipped
  NETLIFY_NEXT_PLUGIN_SKIP = "false"
  # Skip Supabase CLI binary download in production builds
  SKIP_DOWNLOAD = "true"
  # npm configuration for single-app builds
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  NPM_CONFIG_AUDIT = "false"
  NPM_CONFIG_FUND = "false"
  NPM_CONFIG_PROGRESS = "false"
  NPM_CONFIG_LOGLEVEL = "error"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
