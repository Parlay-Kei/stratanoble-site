[build]
  command = "npm install --force --legacy-peer-deps && npm run build"
  publish = "apps/website/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20.18.0"
  # Ensure Netlify Next.js plugin is NOT skipped
  NETLIFY_NEXT_PLUGIN_SKIP = "false"
  # Skip Supabase CLI binary download in production builds
  SKIP_DOWNLOAD = "true"
  # Force npm to resolve conflicts
  NPM_CONFIG_FORCE = "true"
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  NPM_CONFIG_AUDIT = "false"
  NPM_CONFIG_FUND = "false"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
