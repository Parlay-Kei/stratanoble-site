name: Strata Noble CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install root dependencies
        run: npm ci
      
      - name: Install platform dependencies
        run: cd apps/platform && npm ci
      
      - name: Install packages/ui dependencies
        run: cd packages/ui && npm ci
      
      - name: Install packages/utils dependencies
        run: cd packages/utils && npm ci --legacy-peer-deps
      
      - name: Type check
        run: cd apps/platform && npm run type-check
      
      - name: Lint
        run: cd apps/platform && npm run lint
      
      - name: Run tests
        run: cd apps/platform && npm run test:run
        env:
          CI: true
      
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Run contract checks
        run: npm run contract:check
      
      - name: Check brand consistency
        run: npm run brand:check
      
      - name: Upload coverage
        if: matrix.node-version == '22.x'
        uses: codecov/codecov-action@v6
        continue-on-error: true
        with:
          directory: apps/platform/coverage
  
  # The standalone `e2e` job that previously lived here was a duplicate of the
  # dedicated `.github/workflows/e2e.yml` workflow, but with no Supabase env
  # configuration — so it always failed on `npm run e2e` against an unreachable
  # backend. Removed in favor of the single `e2e` workflow, which gates itself
  # on E2E_SUPABASE_URL being present (see apps/platform/E2E_SEED_SETUP.md).

  security:
    runs-on: ubuntu-latest
    needs: ci
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
      
      - name: Check Supabase configuration
        run: npm run supabase:verify
        continue-on-error: true
