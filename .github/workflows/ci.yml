name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Unit tests: Fast, parallel, no DB required
  test-unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js 20.x
      uses: actions/setup-node@v6
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          apps/website/package-lock.json

    - name: Install root dependencies
      run: npm install --legacy-peer-deps

    - name: Install website dependencies
      working-directory: apps/website
      run: npm install --legacy-peer-deps

    - name: Run unit tests
      working-directory: apps/website
      run: npm test -- --testPathIgnorePatterns=integration
      env:
        NODE_ENV: test

  # Integration tests: Serial, requires Supabase
  test-integration:
    runs-on: ubuntu-latest
    # Always run integration tests - no graceful skips
    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js 20.x
      uses: actions/setup-node@v6
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          apps/website/package-lock.json

    - name: Install root dependencies
      run: npm install --legacy-peer-deps

    - name: Install website dependencies
      working-directory: apps/website
      run: npm install --legacy-peer-deps

    - name: Install Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    - name: Hard reset Supabase (clean state)
      run: |
        cd apps/website
        # Stop any existing instances (ignore errors)
        supabase stop --no-backup || true
        # Remove any persisted volumes/state (if they exist)
        # This ensures deterministic runs
        docker volume ls | grep supabase || true
        # Clean up any orphaned containers
        docker ps -a | grep supabase | awk '{print $1}' | xargs -r docker rm -f || true

    - name: Start local Supabase (fresh)
      id: supabase
      run: |
        cd apps/website
        supabase start
        # Capture Supabase status to extract keys
        supabase status -o json > /tmp/supabase-status.json
        echo "service_role_key=$(cat /tmp/supabase-status.json | jq -r '.SERVICE_ROLE_KEY // empty')" >> $GITHUB_OUTPUT
        echo "anon_key=$(cat /tmp/supabase-status.json | jq -r '.ANON_KEY // empty')" >> $GITHUB_OUTPUT
        echo "api_url=$(cat /tmp/supabase-status.json | jq -r '.API_URL // empty')" >> $GITHUB_OUTPUT
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    - name: Run migrations (from scratch)
      run: |
        cd apps/website
        # Reset applies all migrations from scratch
        # This recreates the database and runs all migrations sequentially
        supabase db reset

    - name: Create test infrastructure (canary table)
      run: |
        cd apps/website
        # Create the canary protection table required for integration tests
        # Use psql via Docker to connect to local Supabase database
        docker exec supabase_db_strata-noble psql -U postgres -d postgres -c "
          CREATE TABLE IF NOT EXISTS env_sentinel (
            id TEXT PRIMARY KEY DEFAULT 'test-environment-sentinel',
            canary_value TEXT NOT NULL DEFAULT 'TEST_ENVIRONMENT_VERIFIED_2025',
            created_at TIMESTAMPTZ DEFAULT NOW(),
            updated_at TIMESTAMPTZ DEFAULT NOW()
          );
          INSERT INTO env_sentinel (id, canary_value)
          VALUES ('test-environment-sentinel', 'TEST_ENVIRONMENT_VERIFIED_2025')
          ON CONFLICT (id) DO UPDATE SET updated_at = NOW();
        "

    - name: Validate migrations (idempotent, reversible)
      working-directory: apps/website
      run: node ../../scripts/validate-migrations.mjs

    - name: Check for raw cleanup patterns
      working-directory: apps/website
      run: npm run test:check-cleanup

    - name: Check unit test boundaries (no DB imports)
      working-directory: apps/website
      run: node ../../scripts/check-unit-test-boundaries.mjs

    - name: Check integration harness usage
      working-directory: apps/website
      run: node ../../scripts/check-integration-harness-usage.mjs

    - name: Check table drift (schema vs reset list)
      working-directory: apps/website
      run: node ../../scripts/check-table-drift.mjs

    - name: Scan for exposed secrets
      working-directory: apps/website
      run: node ../../scripts/check-secrets.mjs || true
      # Note: Set to non-blocking due to known false positives (mock JWTs, public anon keys)
      # TODO: Refine check-secrets.mjs to reduce false positives, then remove || true

    - name: Verify log masking
      working-directory: apps/website
      run: node ../../scripts/check-log-masking.mjs
      if: always()

    - name: Run integration tests
      working-directory: apps/website
      run: |
        npm test -- --testPathPatterns=integration --testPathIgnorePatterns=e2e --json --outputFile=test-results.json
      env:
        NODE_ENV: test
        TEST_ENV: 'true'
        NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url || 'http://127.0.0.1:54321' }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role_key }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}

    - name: Collect test metrics
      working-directory: apps/website
      run: |
        node ../../scripts/test-metrics.mjs --test-output=test-results.json
      if: always()

    - name: Upload test metrics
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-metrics
        path: |
          apps/website/test-metrics.json
          apps/website/test-metrics-latest.json
        retention-days: 90

    - name: Stop Supabase
      if: always()
      run: |
        cd apps/website
        supabase stop || true

  # Typecheck: Ensure TypeScript compilation passes
  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js 20.x
      uses: actions/setup-node@v6
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          apps/website/package-lock.json

    - name: Install root dependencies
      run: npm install --legacy-peer-deps

    - name: Install website dependencies
      working-directory: apps/website
      run: npm install --legacy-peer-deps

    - name: Run TypeScript typecheck
      working-directory: apps/website
      run: npm run type-check

  # Contract checks: Validate API schemas, event payloads, and data contracts
  contract-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js 20.x
      uses: actions/setup-node@v6
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install root dependencies
      run: npm install --legacy-peer-deps

    - name: Validate contract schemas
      run: npm run contract:check

    - name: Check contract versioning
      run: npm run contract:version-check

  # Dependency policy checks: Ensure no banned packages, versions within policy
  dependency-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js 20.x
      uses: actions/setup-node@v6
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          apps/website/package-lock.json

    - name: Install root dependencies
      run: npm install --legacy-peer-deps

    - name: Install website dependencies
      working-directory: apps/website
      run: npm install --legacy-peer-deps

    - name: Check dependency policy compliance
      run: npm run dep:check

    - name: Check for security vulnerabilities
      run: npm audit --audit-level moderate || true

  build:
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, typecheck, contract-checks, dependency-checks]
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js 20.x
      uses: actions/setup-node@v6
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          apps/website/package-lock.json

    - name: Install root dependencies
      run: npm install --legacy-peer-deps

    - name: Install website dependencies
      working-directory: apps/website
      run: npm install --legacy-peer-deps

    - name: Run linting
      working-directory: apps/website
      run: npm run lint

    - name: Build website
      working-directory: apps/website
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-key' }}
