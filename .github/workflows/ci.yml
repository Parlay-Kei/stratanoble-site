name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Unit tests: Fast, parallel, no DB required
  test-unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          apps/website/package-lock.json
    
    - name: Install root dependencies
      run: npm install --legacy-peer-deps
    
    - name: Install website dependencies
      working-directory: apps/website
      run: npm install --legacy-peer-deps

    - name: Run unit tests
      working-directory: apps/website
      run: npm test -- --testPathIgnorePatterns=integration
      env:
        NODE_ENV: test

  # Integration tests: Serial, requires Supabase
  test-integration:
    runs-on: ubuntu-latest
    # Always run integration tests - no graceful skips
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          apps/website/package-lock.json
    
    - name: Install root dependencies
      run: npm install --legacy-peer-deps
    
    - name: Install website dependencies
      working-directory: apps/website
      run: npm install --legacy-peer-deps

    - name: Install Supabase CLI
      run: |
        npm install -g supabase

    - name: Hard reset Supabase (clean state)
      run: |
        cd apps/website
        # Stop any existing instances (ignore errors)
        supabase stop --no-backup || true
        # Remove any persisted volumes/state (if they exist)
        # This ensures deterministic runs
        docker volume ls | grep supabase || true
        # Clean up any orphaned containers
        docker ps -a | grep supabase | awk '{print $1}' | xargs -r docker rm -f || true

    - name: Start local Supabase (fresh)
      run: |
        cd apps/website
        supabase start
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    - name: Run migrations (from scratch)
      run: |
        cd apps/website
        # Reset applies all migrations from scratch
        supabase db reset
        # Verify migrations applied
        supabase migration list

    - name: Validate migrations (idempotent, reversible)
      run: node scripts/validate-migrations.mjs

    - name: Check for raw cleanup patterns
      working-directory: apps/website
      run: npm run test:check-cleanup

    - name: Check unit test boundaries (no DB imports)
      run: node scripts/check-unit-test-boundaries.mjs

    - name: Check integration harness usage
      run: node scripts/check-integration-harness-usage.mjs

    - name: Check table drift (schema vs reset list)
      run: node scripts/check-table-drift.mjs

    - name: Scan for exposed secrets
      run: node scripts/check-secrets.mjs

    - name: Verify log masking
      run: node scripts/check-log-masking.mjs
      if: always()

    - name: Run integration tests
      working-directory: apps/website
      run: |
        npm test -- --testPathPattern=integration --testPathIgnorePatterns=e2e --json --outputFile=test-results.json
      env:
        NODE_ENV: test
        TEST_ENV: 'true'
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL || 'http://127.0.0.1:54321' }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}

    - name: Collect test metrics
      working-directory: apps/website
      run: |
        node ../../scripts/test-metrics.mjs --test-output=test-results.json
      if: always()

    - name: Upload test metrics
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-metrics
        path: |
          apps/website/test-metrics.json
          apps/website/test-metrics-latest.json
        retention-days: 90

    - name: Stop Supabase
      if: always()
      run: |
        cd apps/website
        supabase stop || true

  build:
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          apps/website/package-lock.json
    
    - name: Install root dependencies
      run: npm install --legacy-peer-deps
    
    - name: Install website dependencies
      working-directory: apps/website
      run: npm install --legacy-peer-deps

    - name: Enforce ESLint 8 (Next.js compatible)
      working-directory: apps/website
      run: npm install --no-save eslint@8.57.0
    
    - name: Show every eslint copy & caller
      run: |
        echo "== npm ls eslint =="
        cd apps/website && npm ls eslint --all || true

        echo "== yarn/npm who-uses eslint =="
        cd apps/website && npx --yes npm-why eslint || true        # prints all packages that depend on eslint

        echo "== search for rogue flat-config =="
        git ls-files -z | xargs -0 grep -nH "eslint.config.js" || true

        echo "== search for CLI flags inside repo =="
        git grep -n -- "--use-eslintrc\|--resolvePluginsRelativeTo\|--ignore-path" || true
    
    - name: Check Next + eslint-config-next versions
      working-directory: apps/website
      run: |
        npx next --version
        node -e "console.log(require('eslint-config-next/package.json').version)"
    
    - name: Run linting
      working-directory: apps/website
      run: npm run lint
    
    - name: Run security audit
      working-directory: apps/website
      run: npm audit --audit-level moderate
    
    - name: Build project
      run: npm run build
