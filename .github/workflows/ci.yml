name: Strata Noble CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install root dependencies
        run: npm ci
      
      - name: Install platform dependencies
        run: cd apps/platform && npm ci
      
      - name: Type check
        run: cd apps/platform && npm run type-check
      
      - name: Lint
        run: cd apps/platform && npm run lint
      
      - name: Run tests
        run: cd apps/platform && npm run test:run
        env:
          CI: true
      
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Run contract checks
        run: npm run contract:check
      
      - name: Check brand consistency
        run: npm run brand:check
      
      - name: Upload coverage
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          directory: apps/platform/coverage
  
  e2e:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          cd apps/platform && npm ci
      
      - name: Install Playwright
        run: cd apps/platform && npm run e2e:install
      
      - name: Run E2E tests
        run: cd apps/platform && npm run e2e
        env:
          CI: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/platform/playwright-report/
          retention-days: 7
  
  security:
    runs-on: ubuntu-latest
    needs: ci
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
      
      - name: Check Supabase configuration
        run: npm run supabase:verify
        continue-on-error: true
