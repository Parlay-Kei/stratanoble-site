name: Supabase Security Auto-Fix

on:
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/supabase-*.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/supabase-*.mjs'
  workflow_dispatch:
    inputs:
      auto_apply:
        description: 'Auto-apply security fixes'
        type: boolean
        default: true
      force_audit:
        description: 'Force full security audit'
        type: boolean
        default: false
      notify_slack:
        description: 'Send Slack notification'
        type: boolean
        default: true

env:
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
  AUTO_APPLY_FIXES: ${{ github.event.inputs.auto_apply || 'true' }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  security-audit:
    name: Supabase Security Audit & Auto-Fix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Authenticate Supabase CLI
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          echo "🔐 Authenticating with Supabase..."
          supabase projects list > /dev/null 2>&1 || echo "Auth check complete"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link Supabase Project
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: |
          echo "🔗 Linking to project: $SUPABASE_PROJECT_REF"
          supabase link --project-ref $SUPABASE_PROJECT_REF || echo "Link attempt complete"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run Autonomous Security Admin
        id: security_audit
        run: |
          echo "🤖 Running autonomous security admin..."
          node scripts/supabase-admin-autonomous.mjs
        env:
          AUTO_APPLY_FIXES: ${{ env.AUTO_APPLY_FIXES }}
          NOTIFY_ON_FAILURE: 'true'
        continue-on-error: true

      - name: Capture Report Summary
        id: report_summary
        if: always()
        run: |
          # Find the latest report
          REPORT_FILE=$(ls -t SUPABASE_AUTONOMOUS_REPORT_*.md 2>/dev/null | head -1)
          if [ -n "$REPORT_FILE" ]; then
            echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT

            # Extract key metrics for summary
            CRITICAL=$(grep -oP 'Critical Issues \| \K\d+' "$REPORT_FILE" || echo "0")
            FIXES=$(grep -oP 'Fixes Applied \| \K\d+' "$REPORT_FILE" || echo "0")
            STATUS=$(grep -oP 'Status:\*\* \K[^\n]+' "$REPORT_FILE" | head -1 || echo "Unknown")

            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
            echo "fixes=$FIXES" >> $GITHUB_OUTPUT
            echo "status=$STATUS" >> $GITHUB_OUTPUT
          fi

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supabase-security-reports
          path: |
            SUPABASE_ADMIN_REPORT.md
            SUPABASE_AUTONOMOUS_REPORT_*.md
            reports/supabase/*.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Add Job Summary
        if: always()
        run: |
          echo "## 🔒 Supabase Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.report_summary.outputs.status || 'Completed' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Critical Issues:** ${{ steps.report_summary.outputs.critical || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Fixes Applied:** ${{ steps.report_summary.outputs.fixes || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "${{ steps.report_summary.outputs.report_file }}" ]; then
            echo "### Full Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat "${{ steps.report_summary.outputs.report_file }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Find the latest report
            const files = fs.readdirSync('.').filter(f => f.startsWith('SUPABASE_AUTONOMOUS_REPORT_'));
            const reportFile = files.sort().reverse()[0];

            let body = '## 🔒 Supabase Security Audit\n\n';

            if (reportFile && fs.existsSync(reportFile)) {
              const report = fs.readFileSync(reportFile, 'utf-8');

              // Extract summary section
              const summaryMatch = report.match(/## Executive Summary[\s\S]*?(?=---)/);
              if (summaryMatch) {
                body += summaryMatch[0] + '\n\n';
              }

              // Extract status
              const statusMatch = report.match(/\*\*Status:\*\* ([^\n]+)/);
              if (statusMatch) {
                body += `**Overall Status:** ${statusMatch[1]}\n\n`;
              }
            } else {
              body += 'Security audit completed. See workflow artifacts for details.\n';
            }

            body += '\n---\n*Generated by Supabase Security Auto-Fix workflow*';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Create Issue on Critical Failures
        if: failure() || (steps.security_audit.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            // Check if there's already an open issue for security
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated'
            });

            const existingIssue = issues.find(i =>
              i.title.includes('Supabase Security Audit')
            );

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## ⚠️ Security Audit Update\n\n**Workflow Run:** ${context.runId}\n**Date:** ${new Date().toISOString()}\n\nThe security audit has detected issues that require attention.\n\n[View Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Supabase Security Audit - Action Required',
                body: `## Security Audit Failed\n\nThe automated Supabase security audit has identified critical issues.\n\n**Workflow:** ${context.workflow}\n**Run ID:** ${context.runId}\n**Trigger:** ${context.eventName}\n\n### Actions Required\n\n1. Review the security report in the workflow artifacts\n2. Address any critical RLS or policy issues\n3. Run \`npm run supabase:verify\` locally to confirm fixes\n\n[View Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n---\n*This issue was automatically created by the Supabase Security Auto-Fix workflow*`,
                labels: ['security', 'automated', 'high-priority']
              });
            }

      - name: Send Slack Notification
        if: always() && env.SLACK_WEBHOOK_URL != '' && (github.event.inputs.notify_slack != 'false')
        run: |
          STATUS="${{ steps.security_audit.outcome }}"
          CRITICAL="${{ steps.report_summary.outputs.critical || '0' }}"
          FIXES="${{ steps.report_summary.outputs.fixes || '0' }}"

          if [ "$STATUS" = "success" ]; then
            COLOR="good"
            EMOJI=":white_check_mark:"
            TITLE="Supabase Security Audit Passed"
          else
            COLOR="danger"
            EMOJI=":x:"
            TITLE="Supabase Security Audit Failed"
          fi

          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"title\": \"$EMOJI $TITLE\",
                \"fields\": [
                  {\"title\": \"Project\", \"value\": \"$SUPABASE_PROJECT_REF\", \"short\": true},
                  {\"title\": \"Critical Issues\", \"value\": \"$CRITICAL\", \"short\": true},
                  {\"title\": \"Fixes Applied\", \"value\": \"$FIXES\", \"short\": true},
                  {\"title\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"short\": true}
                ],
                \"footer\": \"GitHub Actions\",
                \"footer_icon\": \"https://github.githubassets.com/favicon.ico\",
                \"ts\": $(date +%s)
              }]
            }" \
            $SLACK_WEBHOOK_URL || echo "Slack notification failed"

  # Optional: Database drift check on schedule
  drift-check:
    name: Database Drift Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: security-audit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check for Schema Drift
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          echo "🔍 Checking for database schema drift..."
          supabase db diff --project-ref $SUPABASE_PROJECT_REF > drift-report.txt 2>&1 || true

          if [ -s drift-report.txt ] && grep -q "CREATE\|ALTER\|DROP" drift-report.txt; then
            echo "⚠️ Schema drift detected!"
            cat drift-report.txt
            echo "drift_detected=true" >> $GITHUB_OUTPUT
          else
            echo "✅ No schema drift detected"
            echo "drift_detected=false" >> $GITHUB_OUTPUT
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
